services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinetics
      POSTGRES_PASSWORD: kinetics
      POSTGRES_DB: kinetics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetics -d kinetics"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: "host=db port=5432 user=kinetics password=kinetics dbname=kinetics"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
