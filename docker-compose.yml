services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinetics
      POSTGRES_PASSWORD: kinetics
      POSTGRES_DB: kinetics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetics -d kinetics"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kinetics:kinetics@db:5432/kinetics
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
